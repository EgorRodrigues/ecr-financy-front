<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Previsão Financeira</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: right;
        }

        th {
            background: #f0f0f0;
        }

        td:first-child,
        th:first-child {
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Previsão Financeira</h2>

        <div class="filters">
            <input type="date" id="startDate">
            <input type="date" id="endDate">
            <button onclick="loadData()">Carregar</button>
        </div>

        <canvas id="chart"></canvas>

        <h3>Detalhamento por Categoria</h3>
        <div id="table-container"></div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/financial-forecast/";
        const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYW1lIjoiRWdvciIsImVtYWlsIjoiZWdvci5yb2RyaWd1ZXNAZ21haWwuY29tIiwic3ViIjoiYjI0Mjc2YTAtY2MzZi00ZDNhLTkwZTktZGEzYjBkYmFhZmMzIiwiaWF0IjoxNzc3MjE5MTE5LCJleHAiOjE3NzcyMTk3MTl9.Y6GiSAaoKqNmrESf2cVXleVgWPirTbORB8XAAsFoVO8"; // coloque seu token aqui

        let chart;

        async function loadData() {
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;

            if (!startDate || !endDate) {
                alert("Selecione as datas");
                return;
            }

            try {
                const response = await fetch(`${API_URL}?startDate=${startDate}&endDate=${endDate}`, {
                    headers: {
                        "Authorization": `Bearer ${TOKEN}`,
                        "Content-Type": "application/json"
                    }
                });

                const data = await response.json();

                const monthly = groupByMonth(data);
                renderChart(monthly);

                const tableData = groupByCategoryAndMonth(data);
                renderTable(tableData);

            } catch (error) {
                console.error(error);
                alert("Erro ao carregar dados");
            }
        }

        // -------- GRAFICO --------
        function groupByMonth(data) {
            const result = {};

            data.forEach(item => {
                const month = item.month;

                if (!result[month]) {
                    result[month] = { income: 0, expense: 0 };
                }

                if (item.type === "income") {
                    result[month].income += item.amount;
                } else {
                    result[month].expense += item.amount;
                }
            });

            return result;
        }

        function renderChart(groupedData) {
            const labels = Object.keys(groupedData).sort();

            const incomes = [];
            const expenses = [];
            const balances = [];

            labels.forEach(month => {
                const income = groupedData[month].income;
                const expense = groupedData[month].expense;

                incomes.push(income);
                expenses.push(expense);
                balances.push(income - expense);
            });

            const ctx = document.getElementById("chart").getContext("2d");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels,
                    datasets: [
                        { label: "Receitas", data: incomes },
                        { label: "Despesas", data: expenses },
                        { label: "Saldo", data: balances }
                    ]
                }
            });
        }

        // -------- TABELA --------
        function groupByCategoryAndMonth(data) {
            const result = {};
            const months = new Set();

            data.forEach(item => {
                const { category, month, type, amount } = item;

                months.add(month);

                if (!result[category]) {
                    result[category] = {};
                }

                if (!result[category][month]) {
                    result[category][month] = { income: 0, expense: 0 };
                }

                if (type === "income") {
                    result[category][month].income += amount;
                } else {
                    result[category][month].expense += amount;
                }
            });

            return {
                data: result,
                months: Array.from(months).sort()
            };
        }

        function renderTable({ data, months }) {
            let html = "<table>";

            // header
            html += "<tr><th>Categoria</th>";
            months.forEach(m => {
                html += `<th>${m} (R)</th><th>${m} (D)</th>`;
            });
            html += "<th>Total</th></tr>";

            // rows
            Object.keys(data).forEach(category => {
                let total = 0;

                html += `<tr><td>${category}</td>`;

                months.forEach(m => {
                    const cell = data[category][m] || { income: 0, expense: 0 };

                    const income = cell.income;
                    const expense = cell.expense;

                    total += income - expense;

                    html += `<td>${income.toFixed(2)}</td>`;
                    html += `<td>${expense.toFixed(2)}</td>`;
                });

                html += `<td>${total.toFixed(2)}</td></tr>`;
            });

            html += "</table>";

            document.getElementById("table-container").innerHTML = html;
        }

        // defaults
        document.getElementById("startDate").value = "2026-04-01";
        document.getElementById("endDate").value = "2026-06-30";

    </script>

</body>

</html>
